<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Our Trip</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="header-title">
        <h1 id="trip-title">Loading trip…</h1>
        <p id="trip-subtitle"></p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language / Sprache">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="de">DE</button>
      </div>
    </div>
    <nav class="header-tabs">
      <button class="tab-btn active" data-view="map">Route Map</button>
      <button class="tab-btn" data-view="timeline">Day by Day</button>
      <button class="tab-btn" data-view="ship">The Ship</button>
      <a id="flights-link" class="tab-btn flights-link" href="#" target="_blank" rel="noopener" hidden></a>
    </nav>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
      <div id="map-legend" class="map-legend" tabindex="0" role="button" aria-label="Legend — tap to collapse or expand, or drag to move"></div>
      <aside id="day-panel" class="day-panel hidden">
        <button id="day-panel-close" class="panel-close" aria-label="Close">&times;</button>
        <div id="day-panel-content"></div>
      </aside>
      <div id="ais-panel" class="ais-panel hidden">
        <div class="ais-panel-header">
          <strong id="ais-panel-title">Live ship traffic</strong>
          <button id="ais-close" class="panel-close" aria-label="Close">&times;</button>
        </div>
        <p id="ais-privacy-note" class="ais-note"></p>
        <iframe id="ais-iframe" title="Live ship traffic (MarineTraffic)" loading="lazy"></iframe>
        <div id="ais-resize-handle" class="ais-resize-handle" role="separator" aria-orientation="diagonal" aria-label="Resize" tabindex="0"></div>
      </div>
    </section>

    <section id="view-timeline" class="view">
      <ol id="timeline-list" class="timeline-list"></ol>
    </section>

    <section id="view-ship" class="view">
      <div id="ship-info" class="ship-info"></div>
    </section>
  </main>

  <footer class="app-footer" id="app-footer" tabindex="0" aria-label="Copyright — tap to expand">
    <p id="footer-copyright" class="footer-copyright"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
